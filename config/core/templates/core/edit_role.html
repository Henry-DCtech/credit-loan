{% extends 'core/base.html' %}
{% block content %}
<div class="card-classic p-4" style="max-width:500px; margin:auto;">
  <h4 class="brand-font">Edit Role - {{ target_user.username }}</h4>
  <p class="text-muted">Current: {{ target_profile.role }} | {{ target_profile.branch }}</p>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Role</label>
      <select name="role" class="form-select">
        <option value="OFFICER" {% if target_profile.role == 'OFFICER' %}selected{% endif %}>Officer</option>
        <option value="BM" {% if target_profile.role == 'BM' %}selected{% endif %}>Branch Manager</option>
        <option value="CEO" {% if target_profile.role == 'CEO' %}selected{% endif %}>CEO</option>
        <option value="ADMIN" {% if target_profile.role == 'ADMIN' %}selected{% endif %}>Admin</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Branch</label>
      <select name="branch" class="form-select">
        <option value="LAGOS" {% if target_profile.branch == 'LAGOS' %}selected{% endif %}>LAGOS</option>
        <option value="ABUJA" {% if target_profile.branch == 'ABUJA' %}selected{% endif %}>ABUJA</option>
        <option value="KANO" {% if target_profile.branch == 'KANO' %}selected{% endif %}>KANO</option>
        <option value="PH" {% if target_profile.branch == 'PH' %}selected{% endif %}>PH</option>
      </select>
    </div>
    <button class="btn btn-success w-100">Update</button>
    <a href="/staff/" class="btn btn-secondary w-100 mt-2">Cancel</a>
</div>
{% endblock %}
