{% extends 'core/base.html' %}
{% block content %}
<style>
.apply-card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;box-shadow:0 4px 20px rgba(0,0,0,0.05);padding:32px;max-width:750px;margin:0 auto}
.form-label{font-weight:600;font-size:11px;color:#374151;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.6px;display:block}
.form-control,.form-select{border-radius:8px;border:1px solid #d1d5db;padding:11px 14px;font-size:14px;width:100%;box-sizing:border-box}
.form-control:focus{border-color:#facc15;box-shadow:0 0 0 3px rgba(250,204,21,0.25);outline:none}
.btn-gold{background:#111827;color:#facc15;border-radius:8px;padding:12px 24px;font-weight:700;border:none;cursor:pointer;width:100%}
.btn-cancel{padding:12px 24px;border-radius:8px;border:1px solid #d1d5db;text-decoration:none;color:#374151;font-weight:600;font-size:14px;background:#fff;text-align:center}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.span-2{grid-column:span 2}
.error-banner{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:12px 16px;border-radius:8px;margin-bottom:20px;font-size:14px}
</style>

<div style="padding:24px;background:#f9fafb;min-height:100vh">
  <div style="max-width:750px;margin:0 auto 24px auto;display:flex;justify-content:space-between;align-items:center">
    <div><h2 style="font-weight:800;font-size:22px;margin:0;color:#111827">Executive Risk Console</h2><p style="color:#6b7280;font-size:13px;margin:4px 0 0 0">CEO has sole approval authority</p></div>
    <span style="background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700">ML Model: Active</span>
  </div>

  {% if messages %}<div style="max-width:750px;margin:0 auto 20px auto">{% for m in messages %}<div class="error-banner">{{ m }}</div>{% endfor %}</div>{% endif %}

  <div class="apply-card">
    <h4 style="font-weight:700;font-size:16px;margin-bottom:20px;color:#111827">New Loan Application</h4>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="grid-2">
        <div class="span-2">
          <label class="form-label">Client</label>
          <select name="client_id" class="form-select"><option value="">-- Select Existing Client --</option>{% for c in clients %}<option value="{{ c.id }}" {% if selected_client and selected_client.id == c.id %}selected{% endif %}>{{ c.full_name }} - {{ c.phone }}</option>{% endfor %}</select>
        </div>
        <div class="span-2">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" class="form-control" value="{{ selected_client.full_name|default:'' }}" placeholder="John Doe" required>
        </div>
        <div>
          <label class="form-label">Age</label>
          <input type="number" name="age" class="form-control" value="{{ selected_client.age|default:'30' }}" min="18" max="80" required>
        </div>
        <div>
          <label class="form-label">Monthly Income (₦)</label>
          <input type="number" name="monthly_income" class="form-control" value="{{ selected_client.monthly_income|default:'100000' }}" required>
        </div>
        <div>
          <label class="form-label">Branch</label>
          <select name="branch" class="form-select" required>
            <option value="LAGOS" selected>LAGOS</option><option value="ABUJA">ABUJA</option><option value="KANO">KANO</option><option value="ONDO">ONDO</option><option value="OSUN">OSUN</option><option value="OYO">OYO</option><option value="LOKOJA">LOKOJA</option><option value="PORT_HARCOURT">PORT HARCOURT</option>
          </select>
        </div>
        <div>
          <label class="form-label">Loan Amount (₦)</label>
          <input type="number" name="amount" class="form-control" placeholder="500000" required>
        </div>
        <div>
          <label class="form-label">Employment Years</label>
          <input type="number" name="employment_years" class="form-control" value="2" min="0">
        </div>
        <div>
          <label class="form-label">Credit Score</label>
          <input type="number" name="credit_score" class="form-control" value="650" min="300" max="850">
        </div>
        <div class="span-2">
          <label class="form-label">Purpose</label>
          <textarea name="purpose" class="form-control" rows="3" placeholder="Business expansion, school fees..." required></textarea>
        </div>
      </div>
      <div style="margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <button type="submit" class="btn-gold">Submit for CEO Review</button>
        <a href="{% url 'applications' %}" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
