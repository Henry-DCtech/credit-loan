{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIONCARE DEVELOPER</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F172E;--gold:#E8C468;--gold2:#F5D78E}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;background:var(--navy);overflow-x:hidden}
.bg-anchor{position:fixed;inset:0;z-index:0;width:100vw;height:100vh;display:block}
.bg-anchor img{width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(1.05) saturate(1.1)}
.bg-overlay{position:fixed;inset:0;z-index:1;background:radial-gradient(120% 120% at 30% 30%, rgba(6,10,22,0.95) 0%, rgba(15,23,46,0.78) 60%, rgba(15,23,46,0.95) 100%)}
.bg-glow{position:fixed;z-index:1;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle, rgba(232,196,104,0.20) 0%, transparent 70%);top:-150px;right:-100px;pointer-events:none}

/* FIXED CENTER */
.content{
  position:relative;
  z-index:2;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card-premium{
  width:100%;
  max-width:720px;
  background:linear-gradient(165deg, rgba(255,255,255,0.99) 0%, rgba(248,250,252,0.97) 100%);
  border-radius:32px;
  padding:48px 44px;
  box-shadow:0 40px 120px rgba(0,0,0,0.55), 0 0 0 1px rgba(232,196,104,0.15), inset 0 1px 0 rgba(255,255,255,0.9);
  animation:slideUp .8s ease;
  position:relative;
  text-align:center;
  margin:0 auto;
}
.card-premium::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg, var(--gold), var(--gold2), var(--gold));border-radius:32px 32px 0 0}
.badge-top{display:inline-flex;align-items:center;gap:8px;background:#0F172E;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:1.4px;padding:8px 14px;border-radius:999px;margin-bottom:22px;border:1px solid rgba(232,196,104,0.2)}
.dot{width:6px;height:6px;background:#10b981;border-radius:50%;box-shadow:0 0 0 4px rgba(16,185,129,0.2);animation:pulse 2s infinite}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:clamp(30px, 5vw, 42px);font-weight:800;line-height:0.95;letter-spacing:-1.2px;color:var(--navy)}
h1 span{background:linear-gradient(135deg, #C89A2D, #E8C468);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:15.5px;color:#475569;line-height:1.7;font-style:italic;max-width:540px;margin:0 auto 32px}
.btn-premium{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg, var(--navy) 0%, #1e293b 100%);color:white;padding:16px 36px;border-radius:14px;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 12px 30px rgba(15,23,46,0.25);transition:all .3s ease;border:0}
.btn-premium:hover{transform:translateY(-2px);box-shadow:0 20px 40px rgba(15,23,46,0.35);color:white}
.curr{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:1px;padding:6px 11px;border-radius:999px;background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;margin:3px}
.curr.gold{background:rgba(232,196,104,0.14);color:#92400e;border-color:rgba(232,196,104,0.3)}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(16,185,129,0.2)}50%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}
</style>
</head>
<body>

<a href="/" class="bg-anchor">
  {% if image_base64 %}
    <img src="data:image/jpeg;base64,{{ image_base64 }}" alt="Currency">
  {% else %}
    <img src="{% static 'core/img/money.jpg' %}" alt="Currency">
  {% endif %}
</a>
<div class="bg-overlay"></div>
<div class="bg-glow"></div>

<div class="content">
  <div class="card-premium">
    <div class="badge-top"><span class="dot"></span>SECURE • LIVE • 2026</div>
    <h1>ZIONCARE<span> DEVELOPER</span></h1>
    <p class="sub">It's our pleasure to welcome you to our secure, flexible and reliable Finance System!</p>
    <a href="/login/?role=Start" class="btn-premium">Get Started →</a>
    <div class="mt-4">
      <span class="curr gold">$ USD</span>
      <span class="curr">€ EUR</span>
      <span class="curr">£ GBP</span>
      <span class="curr gold">₦ NGN</span>
      <span class="curr">¥ JPY</span>
    </div>
  </div>
</div>

</body>
</html>
