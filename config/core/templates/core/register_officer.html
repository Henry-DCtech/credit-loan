{% extends "core/base.html" %}
{% block content %}
<style>
.form-card{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.form-card h2{font-size:18px;margin-bottom:20px}
.form-card label{font-size:11px;letter-spacing:1px;color:#64748b;display:block;margin-top:15px}
.form-card input, .form-card select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin-top:5px}
.btn{width:100%;margin-top:20px;background:#0f172a;color:#fff;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
</style>

<div class="form-card">
  <h2>👮 Register New Officer</h2>
  <p style="font-size:12px;color:#64748b">Only CEO can create officers and assign branch</p>
  
  <form method="POST">
    {% csrf_token %}
    <label>USERNAME</label>
    {{ form.username }}
    
    <label>EMAIL (optional)</label>
    {{ form.email }}
    
    <label>PASSWORD</label>
    {{ form.password }}
    
    <label>ROLE</label>
    {{ form.role }}
    
    <label>BRANCH</label>
    {{ form.branch }}
    
    <button class="btn" type="submit">Create Officer</button>
  </form>
</div>
{% endblock %}
