{% extends 'core/base.html' %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap');
  .card-premium{background:white;border-radius:20px;border:1px solid #eef2f7;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
  .role-badge{padding:5px 12px;border-radius:99px;font-size:10px;font-weight:800}
  .role-CEO{background:#0f172a;color:#fbbf24;border:1px solid #334155}
  .role-ADMIN{background:#ede9fe;color:#6d28d9;border:1px solid #ddd6fe}
  .role-MANAGER{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
  .role-OFFICER{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
  .role-CLIENT{background:#f1f5f9;color:#475569}
  .input{width:100%;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;outline:none}
  .input:focus{background:#fff;border-color:#0f172a;box-shadow:0 0 0 4px rgba(15,23,42,.08)}
  .label{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#94a3b8;text-transform:uppercase;margin:14px 0 6px 2px;display:block}
</style>

<div class="container-fluid" style="max-width:1350px">
  <div class="row g-4">
    <!-- LEFT: REGISTER FORM -->
    <div class="col-lg-4">
      <div class="card-premium">
        <h4 style="font-weight:900;margin:0">Register Officer</h4>
        <p style="font-size:12px;color:#64748b;margin:6px 0 18px">Create staff with role & branch</p>
        
        <form method="POST">
          {% csrf_token %}
          <label class="label">Username</label>
          <input class="input" type="text" name="username" placeholder="officer_john" required>
          
          <label class="label">Email</label>
          <input class="input" type="email" name="email" placeholder="john@bank.com" required>
          
          <label class="label">Password</label>
          <input class="input" type="password" name="password" placeholder="••••••••" required>
          
          <label class="label">Confirm Password</label>
          <input class="input" type="password" name="password" placeholder="••••••••" required>
          

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <label class="label">Role *</label>
              <select name="role" class="input" required>
                <option value="OFFICER">CREDIT OFFICER</option>
                <option value="MANAGER">MANAGER</option>
                <option value="ADMIN">ADMIN</option>
                <option value="ADMIN">MIS</option>
                {% if request.user.profile.role == 'CEO' %}
                <option value="CEO">CEO</option>
                {% endif %}
              </select>
            </div>
            <div>
              <label class="label">Branch</label>
              <select name="branch" class="input">
                <option>LAGOS</option><option>ABUJA</option><option>PH</option><option>KANO</option><option>IBADAN</option><option>ENUGU</option>
              </select>
            </div>
          </div>

          <button style="width:100%;margin-top:18px;background:#0f172a;color:white;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:12px;letter-spacing:.8px">+ CREATE OFFICER</button>
        </form>
      </div>
    </div>

    <!-- RIGHT: OFFICER LIST WITH ROLE -->
